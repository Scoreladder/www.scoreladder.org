<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scoreladder Multiplayer</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main id="match">

    <button
      id="startMatchButton"
      type="button"
      disabled
      style="
        display: block;
        padding: 12px 24px;
        margin: 20px auto;
        font-size: 18px;
        cursor: pointer;
        position: relative;
        z-index: 10;
      "
    >
      Join Queue
    </button>

    <div id="players">

      <div class="player">
        <span id="playerName">You</span>
        <span id="playerElo">1200</span>
      </div>

      <div id="vs">VS</div>

      <div class="player">
        <span id="opponentName">Waiting...</span>
        <span id="opponentElo">---</span>
      </div>

    </div>

    <div id="status" role="status" aria-live="polite">
      Waiting for opponent...
    </div>

    <div id="timer">
      11:00
    </div>

    <div id="questions">
      <!-- Questions will go here -->
    </div>

    <button
      id="submitButton"
      type="button"
      disabled
    >
      Submit
    </button>

    <div id="result"></div>

  </main>

  <div id="header"></div>

  <div id="footer"></div>

  <script src="/components/layout.js" defer></script>
  <script src="script.js" defer></script>

</body>
</html>
