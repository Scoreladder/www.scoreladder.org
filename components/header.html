<style>
  /* ── Tokens (must mirror style.css) ── */
  :root {
    --base-color:      #eef0f8;
    --primary-color:   #e4e8f4;
    --secondary-color: #d6dcee;
    --surface:         #ffffff;
    --text-color:      #0e1120;
    --text-muted:      #4a5270;
    --accent:          #4f46e5;
    --accent-hover:    #3d35c8;
    --accent-soft:     #e8e6fd;
    --border:          #c8cee2;
    --border-strong:   #a8b0cc;
    --topbar-height:   64px;
    color-scheme: light;
  }

  html.darkmode {
    --base-color:      #0b0e18;
    --primary-color:   #111525;
    --secondary-color: #192030;
    --surface:         #151c2e;
    --text-color:      #eceef8;
    --text-muted:      #8892b8;
    --accent:          #7c6fff;
    --accent-hover:    #9a90ff;
    --accent-soft:     #26245a;
    --border:          #252f4a;
    --border-strong:   #38456a;
    color-scheme: dark;
  }

  /* ── Topbar shell ── */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--topbar-height);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    z-index: 999;
    box-shadow: 0 1px 0 var(--border), 0 2px 12px rgba(79,70,229,.07);
    font-family: 'Inter', system-ui, sans-serif;
    gap: 16px;
    transition: background 0.25s, border-color 0.25s;
  }

  /* ── Logo ── */
  #topbar .left { display: flex; align-items: center; flex-shrink: 0; }

  #topbar .logo {
    height: 34px;
    display: block;
    transition: opacity 0.15s;
  }

  #topbar .logo:hover { opacity: 0.85; }

  /* ── Nav links ── */
  #topbar nav { flex: 1; display: flex; justify-content: center; }

  #topbar .nav-links {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  #topbar .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    padding: 6px 13px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  #topbar .nav-links a:hover {
    color: var(--accent);
    background: var(--accent-soft);
    text-decoration: none;
  }

  /* ── Right controls ── */
  #topbar .right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  /* ── Dark mode toggle ── */
  #darkmode-toggle {
    cursor: pointer;
    background: var(--secondary-color);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 17px;
    line-height: 1;
    color: var(--text-color);
    transition: background 0.18s, border-color 0.18s;
  }

  #darkmode-toggle:hover {
    background: var(--border);
    border-color: var(--border-strong);
  }

  #darkmode-toggle span { pointer-events: none; }

  /* ── Login button ── */
  #loginBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
    box-shadow: 0 2px 10px rgba(79,70,229,.30);
  }

  #loginBtn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(79,70,229,.40);
  }

  /* ── Avatar ── */
  #topbar .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--accent);
    object-fit: cover;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #topbar .avatar:hover {
    transform: scale(1.08);
    box-shadow: 0 0 0 3px var(--accent-soft), 0 4px 12px rgba(79,70,229,.35);
  }

  /* ── Utilities ── */
  .hidden { display: none !important; }

  /* ── Skip link ── */
  .skip-link {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 1001;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-color);
    border: 2px solid var(--accent);
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    transform: translateY(-200%);
    transition: transform 0.15s;
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
  }

  .skip-link:focus {
    transform: translateY(0);
    color: var(--text-color);
    text-decoration: none;
  }

  /* ── Mobile ── */
  @media (max-width: 768px) {
    #topbar .nav-links { display: none; }
    #topbar { padding: 0 16px; }
  }
</style>

<header>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="topbar">

    <div class="left">
      <a href="/" aria-label="Go to homepage">
        <img id="logo" class="logo" src="/assets/logo.png" alt="Scoreladder">
      </a>
    </div>

    <nav aria-label="Main navigation">
      <div class="nav-links">
        <a href="/comingsoon/">Donate</a>
        <a href="/play/">Play</a>
        <a href="/leaderboards/">The Ladder</a>
        <a href="/rules/">Rules</a>
        <a href="/comingsoon/">Wiki</a>
        <a href="/privacy/">Privacy Policy</a>
      </div>
    </nav>

    <div class="right">
      <button id="darkmode-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <span aria-hidden="true">🌙</span>
      </button>
      <a href="/profile/" aria-label="Go to profile">
        <img id="profileBtn" class="avatar hidden" alt="User avatar">
      </a>
    </div>

  </div>
</header>
