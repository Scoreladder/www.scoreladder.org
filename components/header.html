<style>
  :root {
    --base-color: #f4f6fb;
    --primary-color: #eef1f8;
    --secondary-color: #e2e7f3;
    --surface: #ffffff;
    --text-color: #1a1d2e;
    --text-muted: #5a6280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #ede9fe;
    --border: #d4d9ec;
    --topbar-height: 64px;
    color-scheme: light;
  }

  html.darkmode {
    --base-color: #0f1117;
    --primary-color: #161b27;
    --secondary-color: #1e2535;
    --surface: #1a2035;
    --text-color: #e8eaf6;
    --text-muted: #a8b1c9;
    --accent: #7c73ff;
    --accent-hover: #9a93ff;
    --accent-soft: #2d2b6e;
    --border: #2a3350;
    color-scheme: dark;
  }

  html.darkmode,
  html.darkmode body {
    background-color: #0f1117 !important;
    color: #e8eaf6 !important;
  }

  html.darkmode body {
    background: #0f1117 !important;
  }

  html.darkmode body > *:not(header) {
    color: #e8eaf6;
  }

  html.darkmode main,
  html.darkmode #main-content {
    background-color: #0f1117 !important;
    color: #e8eaf6 !important;
  }

  html.darkmode input,
  html.darkmode textarea,
  html.darkmode select {
    background-color: #1a2035 !important;
    color: #e8eaf6 !important;
    border-color: #2a3350 !important;
  }

  html.darkmode input::placeholder,
  html.darkmode textarea::placeholder {
    color: #a8b1c9 !important;
  }

  html.darkmode hr {
    border-color: #2a3350 !important;
  }

  html.darkmode a {
    color: #7c73ff;
  }

  html.darkmode button:not(#darkmode-toggle) {
    color: #e8eaf6;
  }

  html.darkmode .card,
  html.darkmode .container,
  html.darkmode .panel,
  html.darkmode .box,
  html.darkmode .surface,
  html.darkmode .modal,
  html.darkmode .content,
  html.darkmode section,
  html.darkmode article {
    color: #e8eaf6;
  }

  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--topbar-height);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 999;
    box-shadow: 0 1px 3px rgba(79, 70, 229, 0.08), 0 1px 2px rgba(0, 0, 0, 0.06);
    font-family: 'Inter', system-ui, sans-serif;
    gap: 16px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  #topbar .left {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  #topbar .logo {
    height: 36px;
    cursor: pointer;
    display: block;
  }

  #topbar .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }

  #topbar .nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  #topbar .nav-links a:hover {
    color: var(--accent);
    background: var(--accent-soft);
  }

  #topbar .right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  #darkmode-toggle {
    cursor: pointer;
    background: var(--secondary-color);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 17px;
    line-height: 1;
    color: var(--text-color);
    transition: background 0.18s, border-color 0.18s, color 0.18s;
    pointer-events: auto;
  }

  #darkmode-toggle:hover {
    background: var(--border);
  }

  #darkmode-toggle span {
    pointer-events: none;
  }

  #loginBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif;
    transition: background 0.18s, transform 0.12s;
  }

  #loginBtn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
  }

  #topbar .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--accent);
    object-fit: cover;
    transition: transform 0.15s;
  }

  #topbar .avatar:hover {
    transform: scale(1.08);
  }

  .hidden {
    display: none !important;
  }

  .skip-link {
    position: fixed;
    top: 8px;
    left: 8px;
    z-index: 1001;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-color);
    border: 2px solid var(--accent);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    transform: translateY(-200%);
    transition: transform 0.15s;
  }

  .skip-link:focus {
    transform: translateY(0);
    color: var(--text-color);
    text-decoration: none;
  }

  @media (max-width: 768px) {
    #topbar .nav-links {
      display: none;
    }

    #topbar {
      padding: 0 14px;
    }
  }
</style>

<header>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div id="topbar">
    <div class="left">
      <a href="/" aria-label="Go to homepage">
        <img id="logo" class="logo" src="/assets/logo.png" alt="Scoreladder Homepage">
      </a>
    </div>

    <nav aria-label="Main">
      <div class="nav-links">
        <a href="https://ko-fi.com/scoreladder">Donate</a>
        <a href="/play/">Play</a>
        <a href="/leaderboards/">The Ladder</a>
        <a href="/rules/">Rules</a>
        <a href="/comingsoon/">Wiki</a>
        <a href="/privacy/">Privacy Policy</a>
      </div>
    </nav>

    <div class="right">
      <button
        id="darkmode-toggle"
        type="button"
        aria-label="Toggle dark mode"
        aria-pressed="false"
      >
        <span aria-hidden="true">🌙</span>
      </button>

      <a href="/profile/" aria-label="Go to profile">
        <img id="profileBtn" class="avatar hidden" alt="User avatar">
      </a>

      <button id="loginBtn" type="button">
        Log in
      </button>
    </div>
  </div>
</header>
