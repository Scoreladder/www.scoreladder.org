<!DOCTYPE html>
<html>
<head>
  <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="e3561ef0-50a8-4b4b-84ba-074325b97443" type="text/javascript" async></script>

  <meta charset="UTF-8">
  <link rel="stylesheet" href="/style.css">
  <title>Settings</title>
  <style>
    body {
      font-family: Arial;
      background: var(--base-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      width: 320px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--primary-color);
      color: var(--text-color);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Settings</h2>

  <textarea id="displayName" placeholder="Display Name"></textarea>

  <textarea id="bio" placeholder="Bio"></textarea>
  <input id="banner" placeholder="Banner image URL">
  <input id="twitter" placeholder="Twitter URL">
  <input id="instagram" placeholder="Instagram URL">
  <input id="youtube" placeholder="YouTube URL">
  <input id="website" placeholder="Website URL">
  
  <button onclick="save()">Save</button>
  <button onclick="back()">View Profile</button>
</div>

<script src="load-and-save-settings.js"></script>
<script src="/components/layout.js" defer></script>

<div id="header"></div>
<div id="footer"></div>
</body>
</html>
